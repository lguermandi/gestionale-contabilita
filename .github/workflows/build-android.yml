name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - apps/web/**
      - package.json
      - package-lock.json
      - .github/workflows/build-android.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build --workspace apps/web
        env:
          VITE_API_BASE_URL: https://script.google.com/macros/s/AKfycbzmqAJU81mMCeIFO0GJboYijh_mHQf_zY73MsBj-YrJwiAoYo97nMb0qkHYkT9ZPi0dIQ/exec

      - name: Sync Capacitor Android project
        run: npx cap sync android
        working-directory: apps/web

      - name: Set APK deployment timestamp
        id: build_metadata
        run: echo "timestamp=$(TZ=Europe/Rome date +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
        working-directory: apps/web/android

      - name: Rename APK with deployment timestamp
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/gestionale-contabile-${{ steps.build_metadata.outputs.timestamp }}.apk"
        working-directory: apps/web/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestionale-contabile-${{ steps.build_metadata.outputs.timestamp }}
          path: apps/web/android/app/build/outputs/apk/debug/gestionale-contabile-${{ steps.build_metadata.outputs.timestamp }}.apk
          if-no-files-found: error
          retention-days: 90
